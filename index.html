<style>

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5}

h2{font-size:1.05rem;margin:0 0 10px}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.tile,.hero{display:grid;place-items:center;position:relative}.tile{height:130px}.hero{height:190px;border-radius:24px;margin:14px 0}
.t0{background:var(--t0)}.t1{background:var(--t1)}.t2{background:var(--t2)}.pl{width:62%;max-height:100%;color:var(--ink)}
.heart{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--red)}.heart .ic{width:15px;height:15px}
.rc .t{padding:10px 12px 12px}.rc b{display:block;font-weight:600;line-height:1.25}.rc small{color:var(--mut)}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--ink);border-radius:99px;padding:6px;display:flex;gap:4px;z-index:5}
.nav button{width:46px;height:46px;border-radius:50%;color:var(--app);display:grid;place-items:center;opacity:.85}.nav button.on{background:var(--lime);color:var(--limeink);opacity:1}
.acc{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-top:12px;overflow:hidden}
.ah{display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px}.ab{padding:0 16px 16px}
.acc.dir.open{background:var(--lime);border-color:var(--lime);color:var(--limeink)}.acc.dir.open ol.st li:before{background:var(--limeink);color:var(--lime)}.acc.dir.open .mut{color:color-mix(in srgb,var(--limeink) 78%,var(--lime))}
.hero,.tile{overflow:hidden}.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.btn.alt{border-color:var(--mut)}.in,textarea{border-color:var(--mut)}.md{background:var(--app);border:1px solid var(--line)}
.hero{width:100%}.cnt{position:absolute;right:10px;bottom:10px;background:color-mix(in srgb,var(--shade) 60%,transparent);color:var(--onshade);padding:3px 10px;border-radius:99px;font-size:.8rem}
.th{position:relative;width:84px;height:64px;border-radius:10px;overflow:hidden}.th img{width:100%;height:100%;object-fit:cover}.th button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--app);line-height:1}
.car{position:fixed;inset:0;background:color-mix(in srgb,var(--shade) 92%,transparent);z-index:40;display:flex;align-items:center;justify-content:center}.car img{max-width:100%;max-height:100%;object-fit:contain}
.car button{position:absolute;color:var(--onshade);background:color-mix(in srgb,var(--onshade) 18%,transparent);width:44px;height:44px;border-radius:50%;font-size:1.6rem;line-height:1}.car .x{top:calc(16px + env(safe-area-inset-top,0px));right:16px}.car .pv{left:12px;top:50%}.car .nx{right:12px;top:50%}
.dots{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}.dots i{width:8px;height:8px;border-radius:50%;background:color-mix(in srgb,var(--onshade) 40%,transparent)}.dots i.on{background:var(--onshade)}
.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.rc b,.rc small,h1,.cook b{overflow-wrap:anywhere}.cook b{min-width:0}

.thr{display:flex;align-items:center;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:var(--card)}.thr.on{border-color:var(--ink)}
.thb{flex:1;display:flex;gap:12px;align-items:center;padding:10px 12px;text-align:left;min-width:0}.thb small{margin-left:auto;color:var(--mut)}.thx{width:40px;height:40px;font-size:1.3rem}
.sws{display:flex}.sws i{width:18px;height:18px;border-radius:50%;border:1px solid var(--line);margin-left:-5px}.sws i:first-child{margin-left:0}
.cr{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}.cr span{flex:1}.cr input[type=color]{width:44px;height:32px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--card);cursor:pointer}.cr code{width:64px;font-size:.8rem;color:var(--mut)}
.cpo{background:color-mix(in srgb,var(--shade) 18%,transparent)}.cp{max-width:340px}
.wh{position:relative;width:220px;height:220px;margin:14px auto;touch-action:none;cursor:crosshair;border-radius:50%}.wh canvas{display:block}
.wh i{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--ink);pointer-events:none}
.hx{display:flex;gap:8px;align-items:center;justify-content:center}.hx input{width:110px;text-align:center;text-transform:uppercase;padding:9px}
.sqb{width:40px;height:40px;border-radius:10px;background:var(--line);display:grid;place-items:center}
.cpr{-webkit-appearance:none;appearance:none;width:100%;height:14px;border-radius:99px;margin:16px 0;border:1px solid var(--line)}
.cpr::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--card);border:2px solid var(--ink);cursor:pointer}
.cpr::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--card);border:2px solid var(--ink);cursor:pointer}
.hsl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.hsl label{text-align:center;border:1px solid var(--line);border-radius:14px;padding:8px 4px;background:var(--card);font-size:.8rem;color:var(--mut)}
.hsl input{display:block;width:100%;border:0;background:none;text-align:center;font-size:1.1rem;font-weight:600;color:var(--ink);outline:0;padding:0}
.rcs{display:flex;gap:10px;margin-top:8px}.rcs button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line)}
.csw{width:44px;height:32px;border-radius:8px;border:1px solid var(--line)}
/* Text bleibt in festen Boxen: feste Höhe, Überlänge wird abgeschnitten */
body{overflow-wrap:anywhere}.wrap{overflow-x:clip}
.rc b{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;height:2.5em;line-height:1.25}
.rc small{display:block;height:1.4em;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .t{height:5.4em;overflow:hidden}
.cats{grid-template-columns:repeat(4,minmax(0,1fr))}.ct span{display:block;height:1.3em;line-height:1.3}
.stats>div{min-width:0}.sv{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;height:2.6em;line-height:1.3}
.top{gap:10px}.who{min-width:0}.who span:last-child{min-width:0;max-width:52vw;height:1.5em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thb span:nth-child(2){min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cook .row>b{display:block;min-width:0;max-width:60%;height:1.5em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cook p{overflow-y:auto;max-height:100%}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px;margin-bottom:14px}.tabs button{flex:1;padding:9px 6px;border-radius:99px;font-weight:600;font-size:.9rem;color:var(--mut)}.tabs button.on{background:var(--lime);color:var(--limeink)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const st={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

const SEED=[
`---
titel: Spaghetti Aglio e Olio
kategorie: Hauptgericht
zeit: 20
portionen: 2
favorit: nein
---

## Zutaten
- 200 g Spaghetti
- 4 Knoblauchzehen
- 6 EL Olivenöl
- 1 TL Chiliflocken
- 1 Bund Petersilie
- Salz

## Zubereitung
1. Spaghetti in reichlich Salzwasser al dente kochen, etwas Nudelwasser aufheben.
2. Knoblauch in dünne Scheiben schneiden und im Öl bei niedriger Hitze goldgelb braten.
3. Chili dazugeben, Nudeln und einen Schluck Nudelwasser untermischen.
4. Mit gehackter Petersilie servieren.

## Notizen
Der Knoblauch darf nicht dunkel werden, sonst wird er bitter.`,
`---
titel: Chicken Biryani
kategorie: Hauptgericht
zeit: 40
portionen: 4
favorit: ja
---

## Zutaten
- 500 g Hähnchenbrust
- 300 g Basmatireis
- 2 Zwiebeln
- 150 g Naturjoghurt
- 2 EL Biryani-Gewürz
- 3 EL Öl

## Zubereitung
1. Hähnchen in Joghurt und Gewürz mindestens 30 Minuten marinieren.
2. Zwiebeln goldbraun braten, die Hälfte beiseitestellen.
3. Hähnchen dazugeben und 10 Minuten garen.
4. Reis halb gar kochen, auf das Hähnchen schichten und zugedeckt 15 Minuten dämpfen.
5. Mit den gebratenen Zwiebeln servieren.`,
`---
titel: Pfannkuchen
kategorie: Frühstück
zeit: 25
portionen: 4
favorit: nein
---

## Zutaten
- 250 g Mehl
- 500 ml Milch
- 3 Eier
- 1 Prise Salz
- Butter zum Braten

## Zubereitung
1. Mehl, Milch, Eier und Salz glatt verrühren und 10 Minuten quellen lassen.
2. Butter in der Pfanne erhitzen, eine Kelle Teig verteilen.
3. Von beiden Seiten goldgelb backen.`];

let R=st.get('kb_r',null)||SEED.map(md=>({id:uid(),md}));
let SL=st.get('kb_s',[]);let IMG=st.get('kb_img',{});for(const k in IMG)if(typeof IMG[k]==='string')IMG[k]=[IMG[k]];
let S={v:'home',id:null,q:'',cat:'Alle',serv:0,step:0};
const save=()=>{st.set('kb_r',R);st.set('kb_s',SL);if(!st.set('kb_img',IMG))toast('Speicher voll: Bilder konnten nicht gespeichert werden')};

const KEYS={titel:'t',title:'t',name:'t',rezept:'t',kategorie:'c',category:'c',kat:'c',zeit:'z',time:'z',dauer:'z',gesamtzeit:'z',zubereitungszeit:'z',arbeitszeit:'z',portionen:'p',portion:'p',servings:'p',personen:'p',ergibt:'p',favorit:'f',favorite:'f'};
const clean=t=>t.replace(/^\uFEFF/,'').replace(/^\s*```\w*[ \t]*$/gm,'').trim();
const kv=l=>{const m=l.match(/^[\s>*_#-]*([A-Za-zÄÖÜäöüß]+)[\s*_]*:[\s*_]*(.*?)[\s*_]*$/);if(!m)return null;const k=KEYS[m[1].toLowerCase()];return k?[k,m[2].replace(/^["']|["']$/g,'').trim()]:null};
const mins=v=>{let t=0,f=false;const h=v.match(/(\d+(?:[.,]\d+)?)\s*(?:h\b|std|stunde)/i);if(h){t+=parseFloat(h[1].replace(',','.'))*60;f=true}const m=v.match(/(\d+)\s*(?:min|m\b)/i);if(m){t+=+m[1];f=true}if(!f){const n=v.match(/\d+/);if(!n)return'';t=+n[0]}return String(Math.round(t))};
function parse(md){
  md=clean(md);let meta={},body=md;
  const m=md.match(/^---[ \t]*\r?\n([\s\S]*?)\r?\n---[ \t]*(?:\r?\n([\s\S]*))?$/);
  if(m){m[1].split('\n').forEach(l=>{const r=kv(l);if(r)meta[r[0]]=r[1]});body=m[2]||''}
  const li=t=>t.split('\n').filter(l=>/^\s*([-*]|\d+[.)])\s+/.test(l)).map(l=>l.replace(/^\s*([-*]|\d+[.)])\s+/,'').trim());
  const scan=t=>t.split('\n').forEach(l=>{const r=kv(l);if(r&&!meta[r[0]])meta[r[0]]=r[1]});
  let ing=[],steps=[],notes='';const parts=body.split(/^##\s+/m);scan(parts[0]);
  parts.slice(1).forEach(p=>{const nl=p.indexOf('\n'),h=(nl<0?p:p.slice(0,nl)).replace(/[*_:]/g,'').trim().toLowerCase();let t=nl<0?'':p.slice(nl+1);
    if(/^(zutat|ingred)/.test(h))ing=li(t);
    else if(/^(zubereit|schritt|anleit|direction|so geht)/.test(h))steps=li(t);
    else{if(!/^(notiz|tipp|hinweis)/.test(h)){scan(t);t=t.split('\n').filter(l=>!kv(l)).join('\n')}t=t.trim();if(t)notes+=(notes?'\n':'')+t}});
  const h1=md.match(/^#\s+(.+)$/m);
  return{title:(meta.t||(h1&&h1[1])||'Ohne Titel').replace(/[*_]/g,'').trim(),cat:meta.c||'Sonstiges',time:meta.z?mins(meta.z):'',serv:parseInt(meta.p)||0,fav:/^(ja|true|yes)$/i.test(meta.f||''),ing,steps,notes};
}
function build(p){
  return`---\ntitel: ${p.title}\nkategorie: ${p.cat}\nzeit: ${p.time}\nportionen: ${p.serv||''}\nfavorit: ${p.fav?'ja':'nein'}\n---\n\n## Zutaten\n${p.ing.map(x=>'- '+x).join('\n')}\n\n## Zubereitung\n${p.steps.map((x,i)=>(i+1)+'. '+x).join('\n')}${p.notes?'\n\n## Notizen\n'+p.notes:''}\n`;
}
const sc=(l,f)=>f===1?l:l.replace(/^(\d+(?:[.,]\d+)?)/,m=>String(Math.round(parseFloat(m.replace(',','.'))*f*100)/100).replace('.',','));
const all=()=>R.map(r=>({id:r.id,md:r.md,...parse(r.md)}));
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}

function modal(title,text,o={}){
  const d=document.createElement('div');d.className='ov';
  d.innerHTML=`<div class="md" role="dialog" aria-label="${esc(title)}"><h2>${esc(title)}</h2>${o.hint?`<p class="mut" style="margin-top:0">${o.hint}</p>`:''}<textarea id="mt" rows="12" ${o.ro?'readonly':''} style="font-family:ui-monospace,monospace;font-size:.85rem">${esc(text)}</textarea><div class="row" style="margin-top:12px">${o.import?'<input type="file" id="mf" accept=".md,.txt,text/markdown" multiple>':''}<button class="btn lime" id="mok">${o.ok}</button>${o.dl?'<button class="btn alt" id="mdl">Als Datei laden</button>':''}<button class="btn alt" id="mx">Schließen</button></div></div>`;
  document.body.appendChild(d);const ta=d.querySelector('#mt'),close=()=>d.remove();
  d.querySelector('#mx').onclick=close;d.onclick=e=>{if(e.target===d)close()};
  d.querySelector('#mok').onclick=()=>{o.onok(ta.value,close)};
  if(o.dl)d.querySelector('#mdl').onclick=()=>{try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ta.value],{type:'text/markdown'}));a.download=o.dl;a.click()}catch(e){toast('Download nicht möglich, bitte kopieren')}};
  if(o.import)d.querySelector('#mf').onchange=async e=>{let t='';for(const f of e.target.files)t+=(t?'\n<!-- rezept -->\n':'')+await f.text();ta.value=t};
}
const SEP='\n<!-- rezept -->\n';
function doImport(t){
  const parts=t.split(/\n?<!--\s*rezept\s*-->\n?/i).map(x=>x.trim()).filter(Boolean);let n=0;
  parts.forEach(md=>{const p=parse(md);md=build(p);const ex=R.find(r=>parse(r.md).title.toLowerCase()===p.title.toLowerCase());
    if(ex)ex.md=md;else R.unshift({id:uid(),md});n++});
  save();return n;
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,r=S.id&&all().find(x=>x.id===S.id);
  if(a==='open'){S.id=t.dataset.id;S.serv=parse(R.find(x=>x.id===S.id).md).serv;S.v='detail'}
  else if(a==='back'){S.v=(S.v==='form'&&S.id)?'detail':'home';if(S.v==='home')S.id=null}
  else if(a==='tab'){S.v=t.dataset.v;S.favs=t.dataset.f==='1'}else if(a==='acc'){S.acc=S.acc||{i:1,d:1};S.acc[t.dataset.k]=!S.acc[t.dataset.k]}else if(a==='name'){S.v='settings';S.favs=false}
  else if(a==='cat'){S.cat=t.dataset.c;S.favs=false}
  else if(a==='srv'){S.serv=Math.max(1,S.serv+ +t.dataset.d)}
  else if(a==='fav'){const p=parse(r.md);p.fav=!p.fav;R.find(x=>x.id===S.id).md=build(p);save()}
  else if(a==='new'){S.id=null;S.pimgs=undefined;S.v='form'}
  else if(a==='edit'){S.pimgs=undefined;S.v='form'}
  else if(a==='cook'){S.step=0;S.v='cook'}
  else if(a==='endcook'){S.v='detail'}
  else if(a==='prev'){S.step=Math.max(0,S.step-1)}
  else if(a==='next'){if(S.step>=r.steps.length-1)S.v='detail';else S.step++}
  else if(a==='toshop'){const f=r.serv?S.serv/r.serv:1;r.ing.forEach(i=>SL.push({t:sc(i,f),d:false}));save();toast('Zur Einkaufsliste hinzugefügt');return nav2()}
  else if(a==='chk'){SL[+t.dataset.i].d=t.checked;save()}
  else if(a==='clrdone'){SL=SL.filter(x=>!x.d);save()}
  else if(a==='clrall'){SL=[];save()}
  else if(a==='del'){return ask('Dieses Rezept wirklich löschen?','Löschen',()=>{R=R.filter(x=>x.id!==S.id);delete IMG[S.id];save();S.v='home';S.id=null;render();toast('Gelöscht')})}
  else if(a==='md'){modal(r.title,r.md,{ok:'Änderungen speichern',hint:'Du kannst das Rezept hier direkt als Markdown bearbeiten.',dl:r.title.replace(/[^\wäöüß-]+/g,'_')+'.md',onok:(v,close)=>{R.find(x=>x.id===S.id).md=build(parse(v));save();close();render();toast('Gespeichert')}});return}
  else if(a==='imp'){return mdImport('')}else if(a==='mdnew'){return mdImport()}else if(a==='exp'){return exportAll()}else if(a==='cpp'){return copy(PROMPT)}else if(a==='upd'){return upd()}else if(a==='stab'){S.st=t.dataset.t}else if(a==='cpick'){return colorPicker(t.dataset.k,t.dataset.l)}else if(/^th[a-z]+$/.test(a)){return themeAct(a,t)}else if(a==='rmimg'){S.pimgs=S.pimgs!==undefined?S.pimgs:[...imgs(S.id)];S.pimgs.splice(+t.dataset.i,1);$('#imgp').innerHTML=thumbs();return}else if(a==='gal'){return openGal(S.id)}
  else if(a==='save'){
    const g=i=>$('#'+i).value.trim(),title=g('f-t');if(!title){toast('Bitte einen Titel eingeben');return}
    const lines=v=>v.split('\n').map(x=>x.replace(/^\s*([-*]|\d+[.)])\s+/,'').trim()).filter(Boolean);
    const p={title,cat:g('f-c')||'Sonstiges',time:g('f-m'),serv:parseInt(g('f-s'))||0,fav:r?r.fav:false,ing:lines($('#f-i').value),steps:lines($('#f-p').value),notes:g('f-n')};
    const md=build(p);if(S.id)R.find(x=>x.id===S.id).md=md;else{S.id=uid();R.unshift({id:S.id,md})}
    if(S.pimgs!==undefined){if(S.pimgs.length)IMG[S.id]=S.pimgs;else delete IMG[S.id];S.pimgs=undefined}save();S.serv=p.serv;S.v='detail';toast('Gespeichert')}
  render();
});

async function upd(){toast('Suche nach Updates …');try{for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister();for(const k of await caches.keys())await caches.delete(k)}catch(e){}setTimeout(()=>location.reload(),500)}
function copy(v){const fb=()=>{const t=document.createElement('textarea');t.value=v;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}t.remove();toast(ok?'Kopiert':'Bitte Text markieren und kopieren')};try{navigator.clipboard.writeText(v).then(()=>toast('Kopiert'),fb)}catch(e){fb()}}

const shrink=f=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.75))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(f)});
function openGal(id){const im=imgs(id);let i=0;const d=document.createElement('div');d.className='car';

const go=n=>{i=(i+n+im.length)%im.length;draw()};
const close=()=>{d.remove();document.removeEventListener('keydown',kd)};
const kd=e=>{if(e.key==='Escape')close();if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)};
d.addEventListener('click',e=>{const g=e.target.closest('[data-g]');if(!g){if(e.target===d)close();return}g.dataset.g==='x'?close():go(g.dataset.g==='n'?1:-1)});
let x0=null;d.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});d.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40)go(dx<0?1:-1);x0=null});
document.addEventListener('keydown',kd);draw();document.body.appendChild(d)}

const rgb2hex=a=>'#'+a.map(x=>x.toString(16).padStart(2,'0')).join('');
const hex2rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const rgb2hsv=([r,g,b])=>{r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h=(h*60+360)%360}return{h,s:mx?d/mx:0,v:mx}};
